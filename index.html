<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #070f2b;
            --blue-accent: #1b1a55;
            --blue-bright: #535c91;
            --blue-glow: #00d2ff;
            --text-color: #e6e6e6;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, #000000 0%, #070f2b 100%);
            color: var(--text-color);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        .top-bar {
            background-color: var(--blue-accent);
            width: 90%;
            max-width: 500px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        input[type="number"] {
            background-color: #000000;
            color: var(--blue-glow);
            border: 2px solid var(--blue-bright);
            padding: 8px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 120px;
            text-align: center;
            outline: none;
        }

        button {
            background-color: var(--blue-bright);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--blue-glow);
            color: #000;
        }

        .chat-container {
            background-color: rgba(7, 15, 43, 0.85);
            width: 90%;
            max-width: 500px;
            flex: 1;
            margin-bottom: 20px;
            max-height: 70vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            word-break: break-word;
            font-size: 0.95rem;
        }

        .message.received {
            background-color: var(--blue-accent);
            border: 1px solid var(--blue-bright);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background-color: #2b397c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bottom-bar {
            padding: 12px;
            background-color: #000000;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--blue-accent);
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: #070f2b;
            color: #fff;
            border: 1px solid var(--blue-bright);
            padding: 10px;
            border-radius: 5px;
            outline: none;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="number" id="room-number" placeholder="Number">
        <button id="join-btn" onclick="connectToRoom()">Connect</button>
    </div>

    <div class="chat-container">
        <div id="chat-box"></div>
        <div class="bottom-bar">
            <input type="text" id="message-input" placeholder="Message" disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let roomNumber = null;
        let ws = null;
        let activeTimer = null;
        const myClientId = 'user-' + Math.floor(Math.random() * 10000000);

        const chatBox = document.getElementById('chat-box');
        const roomInput = document.getElementById('room-number');
        const messageInput = document.getElementById('message-input');
        const joinBtn = document.getElementById('join-btn');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connectToRoom() {
            roomNumber = roomInput.value.trim();
            if (!roomNumber) return;

            joinBtn.disabled = true;
            roomInput.disabled = true;
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            joinBtn.textContent = "Online";

            startPollingEngine();
        }

        function startPollingEngine() {
            if (activeTimer) clearInterval(activeTimer);
            executeFetch();
            activeTimer = setInterval(executeFetch, 1000);
        }

        function executeFetch() {
            fetch(`https://allorigins.win{encodeURIComponent('https://ntfy.sh_' + roomNumber + '/json')}`)
                .then(res => res.json())
                .then(wrapper => {
                    const rawLines = wrapper.contents.trim().split('\n');
                    rawLines.forEach(line => {
                        try {
                            const parsed = JSON.parse(line);
                            if (parsed.event === 'message' && parsed.message) {
                                const separatorIndex = parsed.message.indexOf('::');
                                if (separatorIndex !== -1) {
                                    const id = parsed.message.substring(0, separatorIndex);
                                    const txt = parsed.message.substring(separatorIndex + 2);
                                    
                                    const elementId = `msg-${parsed.id}`;
                                    if (!document.getElementById(elementId)) {
                                        const msgType = (id === myClientId) ? 'sent' : 'received';
                                        
                                        const msgDiv = document.createElement('div');
                                        msgDiv.id = elementId;
                                        msgDiv.className = `message ${msgType}`;
                                        msgDiv.textContent = txt;
                                        chatBox.appendChild(msgDiv);
                                        chatBox.scrollTop = chatBox.scrollHeight;
                                    }
                                }
                            }
                        } catch (err) {}
                    });
                })
                .catch(() => {});
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg === '' || !roomNumber) return;

            messageInput.value = '';

            fetch(`https://ntfy.sh_${roomNumber}`, {
                method: 'POST',
                body: `${myClientId}::${msg}`
            })
            .then(() => {
                executeFetch();
                messageInput.focus();
            })
            .catch(() => {});
        }

        roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') connectToRoom(); });
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
