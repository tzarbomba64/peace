<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #070f2b;
            --blue-accent: #1b1a55;
            --blue-bright: #535c91;
            --blue-glow: #00d2ff;
            --text-color: #e6e6e6;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, #000000 0%, #070f2b 100%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: -webkit-fill-available;
        }

        .top-bar {
            background-color: var(--blue-accent);
            width: 90%;
            max-width: 500px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        input[type="number"] {
            background-color: #000000;
            color: var(--blue-glow);
            border: 2px solid var(--blue-bright);
            padding: 8px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 120px;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
        }

        button {
            background-color: var(--blue-bright);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--blue-glow);
            color: #000;
            box-shadow: 0 0 10px var(--blue-glow);
        }

        button:disabled {
            background-color: #222;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .chat-container {
            background-color: rgba(7, 15, 43, 0.85);
            width: 90%;
            max-width: 500px;
            flex: 1;
            margin-bottom: 20px;
            max-height: 70vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            word-break: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.received {
            background-color: var(--blue-accent);
            border: 1px solid var(--blue-bright);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background-color: #2b397c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bottom-bar {
            padding: 12px;
            background-color: #000000;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--blue-accent);
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: #070f2b;
            color: #fff;
            border: 1px solid var(--blue-bright);
            padding: 10px;
            border-radius: 5px;
            outline: none;
            font-size: 1rem;
            -webkit-appearance: none;
        }

        #message-input:focus {
            border-color: var(--blue-glow);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="number" id="room-number" placeholder="Number" inputmode="numeric">
        <button id="join-btn" onclick="connectToRoom()">Connect</button>
    </div>

    <div class="chat-container">
        <div id="chat-box"></div>
        <div class="bottom-bar">
            <input type="text" id="message-input" placeholder="Message" disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let roomNumber = null;
        let pollInterval = null;
        let lastMessageCount = 0;
        const myClientId = 'user-' + Math.floor(Math.random() * 10000000);

        const chatBox = document.getElementById('chat-box');
        const roomInput = document.getElementById('room-number');
        const messageInput = document.getElementById('message-input');
        const joinBtn = document.getElementById('join-btn');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connectToRoom() {
            roomNumber = roomInput.value.trim();
            if (!roomNumber) return;

            joinBtn.disabled = true;
            roomInput.disabled = true;
            
            messageInput.disabled = false;
            sendBtn.disabled = false;
            
            joinBtn.textContent = "Online";
            joinBtn.style.backgroundColor = "rgba(0, 210, 255, 0.2)";
            joinBtn.style.color = "var(--blue-glow)";
            joinBtn.style.border = "1px solid var(--blue-glow)";

            fetchMessages();
            pollInterval = setInterval(fetchMessages, 1500);
        }

        function getStorageUrl() {
            return `https://workers.dev{roomNumber}`;
        }

        function fetchMessages() {
            if (!roomNumber) return;
            
            fetch(getStorageUrl())
                .then(res => res.ok ? res.json() : [])
                .then(messages => {
                    if (messages.length > lastMessageCount) {
                        const newMessages = messages.slice(lastMessageCount);
                        newMessages.forEach(msg => {
                            if (msg.senderId !== myClientId) {
                                appendMessage(msg.text, 'received');
                            }
                        });
                        lastMessageCount = messages.length;
                    }
                })
                .catch(() => {});
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg === '' || !roomNumber) return;

            const url = getStorageUrl();
            messageInput.value = '';

            fetch(url)
                .then(res => res.ok ? res.json() : [])
                .then(messages => {
                    const newPayload = {
                        senderId: myClientId,
                        text: msg,
                        time: Date.now()
                    };
                    
                    let updated = [...messages, newPayload];
                    if (updated.length > 40) updated.shift();

                    return fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updated)
                    });
                })
                .then(() => {
                    appendMessage(msg, 'sent');
                    lastMessageCount++;
                    messageInput.focus();
                })
                .catch(() => {});
        }

        roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') connectToRoom(); });
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
