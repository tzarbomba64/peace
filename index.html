<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Number Chat</title>
    <script src="https://unpkg.com"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #070f2b;
            --blue-accent: #1b1a55;
            --blue-bright: #535c91;
            --blue-glow: #00d2ff;
            --text-color: #e6e6e6;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, #000000 0%, #070f2b 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h2 {
            margin-top: 20px;
            color: var(--blue-glow);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .top-bar {
            background-color: var(--blue-accent);
            width: 90%;
            max-width: 500px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid var(--blue-bright);
        }

        label {
            font-size: 0.9rem;
            color: #ffffff;
            font-weight: bold;
        }

        input[type="number"] {
            background-color: #000000;
            color: var(--blue-glow);
            border: 2px solid var(--blue-bright);
            padding: 10px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 150px;
            text-align: center;
            outline: none;
        }

        button {
            background-color: var(--blue-bright);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: var(--blue-glow);
            color: #000;
            box-shadow: 0 0 10px var(--blue-glow);
        }

        button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
            box-shadow: none;
        }

        .chat-container {
            background-color: rgba(7, 15, 43, 0.8);
            width: 90%;
            max-width: 500px;
            height: 60vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid var(--blue-bright);
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 8px 12px;
            border-radius: 15px;
            max-width: 75%;
            word-break: break-word;
        }

        .message.received {
            background-color: var(--blue-accent);
            border: 1px solid var(--blue-bright);
            align-self: flex-start;
        }

        .message.sent {
            background-color: #2b397c;
            color: #fff;
            align-self: flex-end;
        }

        .message.system {
            background-color: transparent;
            color: var(--blue-glow);
            align-self: center;
            font-style: italic;
            font-size: 0.85rem;
            text-align: center;
        }

        .bottom-bar {
            padding: 15px;
            background-color: #000000;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--blue-accent);
        }

        #message-input {
            flex: 1;
            background-color: #070f2b;
            color: #fff;
            border: 1px solid var(--blue-bright);
            padding: 10px;
            border-radius: 5px;
            outline: none;
        }

        #message-input:focus {
            border-color: var(--blue-glow);
        }
    </style>
</head>
<body>

    <h2>Secure Blue/Black Chat</h2>

    <div class="top-bar">
        <label for="room-number">Enter Number:</label>
        <input type="number" id="room-number" placeholder="e.g. 5555">
        <button id="join-btn" onclick="initPeer()">Connect</button>
    </div>

    <div class="chat-container">
        <div id="chat-box">
            <div class="message system">Enter a matching number on two different devices/tabs to chat.</div>
        </div>
        <div class="bottom-bar">
            <input type="text" id="message-input" placeholder="Type a message..." disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        
        const chatBox = document.getElementById('chat-box');
        const roomInput = document.getElementById('room-number');
        const messageInput = document.getElementById('message-input');
        const joinBtn = document.getElementById('join-btn');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function initPeer() {
            const roomNumber = roomInput.value.trim();
            if (!roomNumber) {
                alert("Please enter a number first.");
                return;
            }

            joinBtn.disabled = true;
            roomInput.disabled = true;
            appendMessage("Connecting to signaling server...", "system");

            // spec
            peer = new Peer(`room-${roomNumber}-user-${Math.floor(Math.random() * 10000)}`, {
                host: '://peerjs.com',
                port: 443,
                secure: true,
                debug: 1
            });

            peer.on('open', (id) => {
                appendMessage("Waiting for someone else to connect to this number...", "system");
                
                // scan
                setTimeout(() => {
                    discoverPeers(roomNumber);
                }, 1000);
            });

            peer.on('connection', (incomingConn) => {
                handleIncomingConnection(incomingConn);
            });

            peer.on('error', (err) => {
                console.error(err);
                appendMessage(`Connection Error. Retrying...`, "system");
                resetUI();
            });
        }

        function discoverPeers(roomNumber) {
            // Find active sessions on the server network matching this number prefix
            if (!peer || peer.destroyed) return;
            
            peer.listAllPeers((peers) => {
                const targets = peers.filter(pId => pId.startsWith(`room-${roomNumber}-`) && pId !== peer.id);
                if (targets.length > 0) {
                    // Found a peer! Connect directly
                    connectToPeer(targets[0]);
                }
            });
        }

        function connectToPeer(targetId) {
            appendMessage("Found someone! Establishing private tunnel...", "system");
            conn = peer.connect(targetId, { reliable: true });
            setupConnectionHandlers();
        }

        function handleIncomingConnection(incomingConn) {
            if (conn) return; // Already connected
            conn = incomingConn;
            setupConnectionHandlers();
        }

        function setupConnectionHandlers() {
            conn.on('open', () => {
                appendMessage("Connected! Chat session secure.", "system");
                messageInput.disabled = false;
                sendBtn.disabled = false;
                joinBtn.textContent = "Online";
            });

            conn.on('data', (data) => {
                appendMessage(data, 'received');
            });

            conn.on('close', () => {
                appendMessage("The other person left.", "system");
                resetUI();
            });
            
            conn.on('error', () => {
                appendMessage("Connection dropped.", "system");
                resetUI();
            });
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg !== '' && conn && conn.open) {
                conn.send(msg);
                appendMessage(msg, 'sent');
                messageInput.value = '';
            }
        }

        function resetUI() {
            if(conn) conn.close();
            if(peer) peer.destroy();
            conn = null;
            peer = null;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            joinBtn.disabled = false;
            roomInput.disabled = false;
            joinBtn.textContent = "Connect";
        }

        roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') initPeer(); });
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
