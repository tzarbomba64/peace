<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cloudflare.com"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --bg-light: #070f2b;
            --blue-accent: #1b1a55;
            --blue-bright: #535c91;
            --blue-glow: #00d2ff;
            --text-color: #e6e6e6;
        }

        body {
            background-color: var(--bg-dark);
            background-image: linear-gradient(135deg, #000000 0%, #070f2b 100%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: -webkit-fill-available;
        }

        .top-bar {
            background-color: var(--blue-accent);
            width: 90%;
            max-width: 500px;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        input[type="number"] {
            background-color: #000000;
            color: var(--blue-glow);
            border: 2px solid var(--blue-bright);
            padding: 8px;
            border-radius: 5px;
            font-size: 1.1rem;
            width: 120px;
            text-align: center;
            outline: none;
            -webkit-appearance: none;
        }

        button {
            background-color: var(--blue-bright);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--blue-glow);
            color: #000;
            box-shadow: 0 0 10px var(--blue-glow);
        }

        button:disabled {
            background-color: #222;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }

        .chat-container {
            background-color: rgba(7, 15, 43, 0.85);
            width: 90%;
            max-width: 500px;
            flex: 1;
            margin-bottom: 20px;
            max-height: 70vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            border: 1px solid var(--blue-bright);
            box-sizing: border-box;
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 18px;
            max-width: 75%;
            word-break: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.received {
            background-color: var(--blue-accent);
            border: 1px solid var(--blue-bright);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.sent {
            background-color: #2b397c;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background-color: transparent;
            color: var(--blue-glow);
            align-self: center;
            font-size: 0.85rem;
            text-align: center;
            padding: 5px;
        }

        .bottom-bar {
            padding: 12px;
            background-color: #000000;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--blue-accent);
            align-items: center;
        }

        #message-input {
            flex: 1;
            background-color: #070f2b;
            color: #fff;
            border: 1px solid var(--blue-bright);
            padding: 10px;
            border-radius: 5px;
            outline: none;
            font-size: 1rem;
            -webkit-appearance: none;
        }

        #message-input:focus {
            border-color: var(--blue-glow);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="number" id="room-number" placeholder="Number" inputmode="numeric">
        <button id="join-btn" onclick="connectToBridge()">Connect</button>
    </div>

    <div class="chat-container">
        <div id="chat-box"></div>
        <div class="bottom-bar">
            <input type="text" id="message-input" placeholder="Message" disabled>
            <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
        </div>
    </div>

    <script>
        let client = null;
        let currentTopic = null;
        const myClientId = 'client-' + Math.floor(Math.random() * 10000000);

        const chatBox = document.getElementById('chat-box');
        const roomInput = document.getElementById('room-number');
        const messageInput = document.getElementById('message-input');
        const joinBtn = document.getElementById('join-btn');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, type) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function connectToBridge() {
            const roomNumber = roomInput.value.trim();
            if (!roomNumber) return;

            joinBtn.disabled = true;
            roomInput.disabled = true;

            client = mqtt.connect('wss://://hivemq.com', {
                clientId: myClientId,
                clean: true,
                connectTimeout: 4000,
                reconnectPeriod: 2000
            });

            client.on('connect', () => {
                currentTopic = `sec-num-chat/room-${roomNumber}`;
                
                client.subscribe(currentTopic, { qos: 1 }, (err) => {
                    if (!err) {
                        messageInput.disabled = false;
                        sendBtn.disabled = false;
                        joinBtn.textContent = "Online";
                        joinBtn.style.backgroundColor = "rgba(0, 210, 255, 0.2)";
                        joinBtn.style.color = "var(--blue-glow)";
                        joinBtn.style.border = "1px solid var(--blue-glow)";
                    } else {
                        resetUI();
                    }
                });
            });

            client.on('message', (topic, payload) => {
                try {
                    const data = JSON.parse(payload.toString());
                    if (data.senderId === myClientId) {
                        appendMessage(data.text, 'sent');
                    } else {
                        appendMessage(data.text, 'received');
                    }
                } catch (e) {}
            });

            client.on('error', (err) => {
                resetUI();
            });
        }

        function sendMessage() {
            const msg = messageInput.value.trim();
            if (msg !== '' && client && client.connected && currentTopic) {
                const payload = {
                    senderId: myClientId,
                    text: msg,
                    timestamp: Date.now()
                };
                
                client.publish(currentTopic, JSON.stringify(payload), { qos: 1 });
                messageInput.value = '';
                messageInput.focus();
            }
        }

        function resetUI() {
            if (client) {
                client.end();
            }
            client = null;
            currentTopic = null;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            joinBtn.disabled = false;
            roomInput.disabled = false;
            joinBtn.textContent = "Connect";
            joinBtn.style = "";
        }

        roomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') connectToBridge(); });
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    </script>
</body>
</html>
